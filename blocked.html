<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked - Voydr</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #ef4444;
    }
    p {
      font-size: 16px;
      color: #4b5563;
      line-height: 1.5;
    }
    .hostname {
      font-weight: bold;
      color: #111827;
      background: #f3f4f6;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin: 10px 0;
      word-break: break-all;
    }
    .brand {
      margin-top: 30px;
      font-size: 14px;
      color: #9ca3af;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Focus Mode Active</h1>
    <p>You have hard-blocked access to:</p>
    <div class="hostname" id="blocked-site">this site</div>
    <p>This block will remain in effect until midnight. Stay intentional.</p>
    <div class="brand">Voydr Performance Coach</div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const site = urlParams.get('site');
    if (site) {
      document.getElementById('blocked-site').textContent = site;
    }
  </script>
</body>
</html>
